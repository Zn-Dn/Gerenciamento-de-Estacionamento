<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/css/motorista.css">

    <title>Motorista</title>

</head>

<body>

    <main>

        <section id="informacoes">

            <div id="pesquisa">

                <label id="labelPesquisa" for="">
                    Pesquisar nome<input type="text">
                </label>

            </div>

            <div id="dados">

                <label id="labelNome" for="">
                    Nome
                    <p id="nome"></p>
                </label>

                <label id="labelStatus" for="">
                    status
                    <p id="contador"></p>
                </label>

                <label id="labelTempo" for="">
                    tempo
                    <p id="tempo"></p>

                    <div class="more">
                        <p id="entrada" class="tempo-infor"></p>
                        <p id="sainda" class="tempo-infor"></p>
                    </div>
                </label>

                <label id="labelTelefone" for="">
                    Telefone
                    <p id="telefone"></p>
                </label>

                <label id="labelPlaca" for="">
                    Placa
                    <p id="placa"></p>
                </label>

            </div>



            <button id="busca">Buscar</button>
            <button id="button-left">Cadastro</button>
        </section>

    </main>

    <script src="/ts/motorista.js"></script>

</body>

</html>
