<!DOCTYPE html>

<html lang="en">

<head>

    <link rel="stylesheet" href="/src/css/motorista.css">

</head>

            <div id="pesquisa">

                <label id="labelPesquisa" for="">

            </div>

            <div id="dados">

                </label>

                <label id="labelStatus" for="">
                    status

                </label>

                <label id="labelTempo" for="">

                    <div class="more">
                        <p id="entrada" class="tempo-infor"></p>
                        <p id="sainda" class="tempo-infor"></p>
                    </div>

                <label id="labelTelefone" for="">
                    Telefone
                    <p id="telefone"></p>
                </label>

                <label id="labelPlaca" for="">
                    Placa
                    <p id="placa"></p>
                </label>

            </div>



            <button id="busca">buscar</button>

        </section>

    </main>

    <script src="/dist/ts/motorista.js"></script>
