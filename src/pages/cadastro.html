<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/cadastro.css">
    <title>Cadastro</title>
</head>

<body>
    <main>
        <section class="motorista-carro">
           
           <div class="infor">

            <div class="motorista">
           <h2 class="Titulo">
                Informações do Motorista
            </h2>
            
                <form action="">
                    <label for="">
                        Nome Completo: <input type="text" id="nome">
                    </label>
                    <label for="">CPF:
                        <input type="number" id="cpf">
                    </label>
                    <label for="">
                        Telefone: <input type="number" id="telefone">
                    </label>
                    <div id="escolharTempo">
                        
                        <label for="">
                            Tempo: <input type="number" id="tempo">
                        </label>
                        <select>
    <option value="minutos">Minutos</option>
    <option value="horas">Horas</option>
</select>
                    </div>
                </form>
</div>

<div class="carro">

    <h2 class="Titulo">
                Informações do Carro
            </h2>
    <form action="">
    <div class="placa">
        <label for="placa">Placa:</label>
        <input type="text" id="placa">
    </div>

    <div class="modelo">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" >
    </div>

    <div class="cor">
        <label for="cor">Cor:</label>
        <input type="text" id="cor" >
    </div>
   
</form>
</div>
            </div>
<button id="buttoncadastro">Cadastrar</button>
        </section>
    </main>
    <script src="/dist/ts/cadastro.js"></script>
</body>

</html>
